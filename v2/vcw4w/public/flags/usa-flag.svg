    <use href="#usa-star" x="57" y="16.16"/>
    <use href="#usa-star" x="69.67" y="16.16"/>
    <use href="#usa-star" x="6.33" y="26.93"/>
    <use href="#usa-star" x="19" y="26.93"/>
    <use href="#usa-star" x="31.67" y="26.93"/>
    <use href="#usa-star" x="44.33" y="26.93"/>
    <use href="#usa-star" x="57" y="26.93"/>
    <use href="#usa-star" x="69.67" y="26.93"/>
    <use href="#usa-star" x="6.33" y="37.7"/>
