    <use href="#usa-star" x="69.67" y="37.7"/>
    <use href="#usa-star" x="6.33" y="48.47"/>
    <use href="#usa-star" x="19" y="48.47"/>
    <use href="#usa-star" x="31.67" y="48.47"/>
    <use href="#usa-star" x="44.33" y="48.47"/>
    <use href="#usa-star" x="57" y="48.47"/>
    <use href="#usa-star" x="69.67" y="48.47"/>
    <!-- 5-star rows -->
    <use href="#usa-star" x="12.67" y="10.77"/>
