<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GraveGain1DA — The Ley-Line March</title>
    <meta name="description" content="A one-dimensional GraveGain RPG. Walk the ley-line east: always right, never jump. Turn-based tactics or real-time action on one rules core.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="game.css">
<style id="fourweird-game-only">
/* Generated by sync-game-bundles: game-only runtime. The v1 site chrome
   (nav, header, info panel, credits, bio, promos, footer) is stripped at
   build time; these rules hide any remnant and make the game fill the frame. */
html,body{margin:0!important;padding:0!important;min-height:100%!important;background:#000!important}
body{display:block!important}
[id*="nav-placeholder"],[id*="footer-placeholder"],[id*="starfield"],
[class*="game-header"],[class*="game-info-panel"],[class*="credits-section"],
[class*="bio-section"],[class*="more-games"],[class*="more-kouzi"],
[kouzi-cta],[class*="kouzi-cta"],[class*="madi-cta"]{display:none!important}
[class*="game-page"],[class*="game-main"]{margin:0!important;padding:0!important;max-width:none!important;min-height:100%!important}
[class*="game-frame"],.game-wrapper,.game-container{width:100%!important;max-width:none!important;margin:0!important;border-radius:0!important}
/* Full-window stage: stripped bundles (e.g. lastwordszombies) keep their
   v1 grid (1fr + 340px sidebar) and fixed aspect-ratio (4/3) in game.css.
   With the sidebar stripped that leaves a narrow centered column with an
   empty track beside it, pillarboxed inside the shell's 16:9 frame.
   Collapse to a single full-bleed column and let the frame fill the iframe
   height instead of letterboxing. Dark scrollbars so overlay scrolling never
   flashes a light native scrollbar inside the dark game window. */
[class*="game-main"]{display:grid!important;grid-template-columns:1fr!important;gap:0!important;width:100%!important}
[class*="game-frame"]{aspect-ratio:auto!important;height:100%!important;min-height:100%!important}
/* Stripped-bundle fallback for the v1 TEMPLATE-4weird layout: styles.css is
   removed above, but kouzi/orbitaldrift-style bundles rely on it for frame
   sizing, canvas fill, overlay cover, and .hidden. Without these the frame
   collapses to a black box with always-visible pause/game-over screens.
   Placed after the generic game-frame override so these more-specific class
   rules win for TEMPLATE bundles only (non-TEMPLATE bundles unaffected). */
.TEMPLATE-4weird-game-frame{position:relative!important;width:100%!important;height:auto!important;aspect-ratio:4/3!important;min-height:320px!important;background:#000!important;overflow:hidden!important}
#TEMPLATE-4weird-gameCanvas,.TEMPLATE-4weird-gameCanvas{width:100%!important;height:100%!important;display:block!important;background:#000!important}
.TEMPLATE-4weird-game-overlay{position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:center!important;background:rgba(0,0,0,.92)!important;z-index:10!important;text-align:center!important;overflow:auto!important}
.TEMPLATE-4weird-game-overlay.hidden{display:none!important}
.TEMPLATE-4weird-fullscreen-btn{position:absolute!important;top:10px!important;right:10px!important;z-index:20!important}
html{scrollbar-color:rgba(255,255,255,.25) #000}
[class*="game-overlay"]{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
[class*="game-overlay"]::-webkit-scrollbar{width:8px}
[class*="game-overlay"]::-webkit-scrollbar-track{background:transparent}
[class*="game-overlay"]::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:4px}
</style></head>
<body>
    <div id="gg1dWrap">
        <div id="gg1dHud" hidden>
            <span>❤️ <span id="gg1dHpText">20/20</span></span>
            <span class="bar"><div id="gg1dHpFill" style="width:100%"></div></span>
            <span>⭐ Lv<span id="gg1dLvl">1</span> <span class="dim" id="gg1dXpText">0/8</span></span>
            <span class="bar"><div id="gg1dXpFill" style="width:0%"></div></span>
            <span class="gold">🪙 <span id="gg1dGold">0</span></span>
            <span>🧪 <span id="gg1dPot">1</span></span>
            <span class="dim" id="gg1dSector">Sector 1/5</span>
            <span class="dim" id="gg1dMode">TURN</span>
            <div id="gg1dBossBar"><span>💀 <span id="gg1dBossName">BOSS</span></span>
                <span class="bar"><div id="gg1dBossFill" style="width:100%"></div></span>
            </div>
        </div>
        <div id="gg1dStage">
            <canvas id="gg1dCanvas" width="960" height="540"></canvas>
            <button id="gg1dFsBtn" title="Toggle fullscreen (F)">⛶</button>
            <div id="gg1dBanner"><div id="gg1dBannerCard">
                <p id="gg1dBannerTitle"></p>
                <p id="gg1dBannerText"></p>
            </div></div>
        </div>
        <div id="gg1dTouch" hidden>
            <button data-act="step">➡️ STEP</button>
            <button data-act="attack">⚔️ ATK</button>
            <button data-act="ability">✦ ABIL</button>
            <button data-act="potion">🧪 POT</button>
            <button data-act="wait">⏳ WAIT</button>
        </div>
        <div id="gg1dMenu">
            <h1>GRAVEGAIN1D</h1>
            <p class="sub">The Ley-Line March — walk east, hold the line, deliver the charge.</p>
            <div class="gg1dChoices" id="gg1dModePick">
                <button data-mode="turn" class="sel">🎲 TURN-BASED<small>Think. Every input is one tick. No clock.</small></button>
                <button data-mode="realtime">⚡ REAL-TIME<small>Same rules, live clock. Queue intents.</small></button>
            </div>
            <div class="gg1dChoices" id="gg1dRacePick">
                <button data-race="human" class="sel">👩‍🚀 Human<small>Balanced · sturdy line-holder</small></button>
                <button data-race="elf">🧝‍♀️ Elf<small>Fast +1 SPD +1 ATK, frail −2 HP</small></button>
                <button data-race="dwarf">🧔🏻 Dwarf<small>Tanky +8 HP +1 DEF, slow −1 SPD</small></button>
                <button data-race="orc">🟢🟢🟢👹 Orc<small>Bruiser +5 HP +1 ATK</small></button>
            </div>
            <div class="gg1dChoices" id="gg1dClassPick">
                <button data-class="rifleman" class="sel">🔫 Line Rifleman<small>HP20 ATK5 · rifle range 4 · Burst Fire</small></button>
                <button data-class="sapper" class="sel0">🛠️ Forge Sapper<small>HP30 ATK4 DEF3 · scattergun range 3 · Stone Oath</small></button>
                <button data-class="runner">🌿 Grove Runner<small>HP18 ATK7 · hex range 3 · Hex Nova</small></button>
                <button data-class="warrior">⚔️ Compact Warrior<small>HP24 ATK6 · range 3 · Whirlwind</small></button>
                <button data-class="mage">🔮 Ley Mage<small>HP18 ATK6 · range 4 · Arcane Storm</small></button>
                <button data-class="tank">🛡️ Bulwark Tank<small>HP32 ATK4 DEF3 · range 3 · Bulwark Stance</small></button>
                <button data-class="support">⚕️ Field Support<small>HP22 ATK4 · range 4 · Mend Surge</small></button>
            </div>
            <button id="gg1dGoBtn">➡️ MARCH EAST</button>
            <div id="gg1dCodex"></div>
        </div>
    </div>
    <script src="/games/html/fourweird-graphics.js"></script>
    <script src="/games/html/fourweird-workers.js"></script>
    <script src="game.js"></script>
    <script src="/games/html/gravegain-1dart.js" data-slug="gravegain1d"></script>
    <script src="/games/html/gravegain-arsenal.js" data-slug="gravegain1d"></script>
    <script src="/games/html/gravegain-arsenal2d.js" data-slug="gravegain1d"></script>
    <script src="/games/html/gravegain-emergent.js" data-slug="gravegain1d"></script>
    <script src="/games/html/gravegain-agegore.js" data-slug="gravegain1d"></script>
    <script src="/games/html/gravegain-perf.js" data-slug="gravegain1d"></script>
    <script>
        // Fullscreen overlay button: shell helper first, native fallback otherwise.
        (function () {
            var btn = document.getElementById('gg1dFsBtn');
            var stage = document.getElementById('gg1dStage');
            if (!btn || !stage) return;
            btn.addEventListener('click', function () {
                try {
                    if (typeof window.__fourweirdToggleFullscreen === 'function') { window.__fourweirdToggleFullscreen(); return; }
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        var p = stage.requestFullscreen ? stage.requestFullscreen() : (stage.webkitRequestFullscreen ? stage.webkitRequestFullscreen() : null);
                        if (p && p.catch) p.catch(function () {});
                    } else if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } catch (e) {}
            });
            // Re-fit hook: game.js listens for resize (sizeCanvas) + fullscreenchange itself.
            document.addEventListener('fullscreenchange', function () { try { window.dispatchEvent(new Event('resize')); } catch (e) {} });
        })();
    </script>
<script src="/games/html/runtime-bridge.js" data-slug="gravegain1dA"></script><script src="/games/html/fourweird-music.js" data-slug="gravegain1dA"></script></body>
</html>
