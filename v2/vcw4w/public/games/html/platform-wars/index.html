<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10142b"><title>Platform Wars: Phone vs Desktop — 4weird</title><link rel="stylesheet" href="game.css"></head>
<body><main><header><a href="/games">← Games</a><h1>PLATFORM <i>WARS</i></h1><p>PHONE <b>VS</b> DESKTOP</p></header><section id="lobby" class="panel"><h2>Cross-platform arena</h2><p id="device"></p><label class="savepick">Save file <select id="slot"><option value="0">Save 0 (cheat-proof)</option><option value="1">Save 1</option><option value="2">Save 2</option><option value="3">Save 3</option></select></label><div class="mode"><button id="quick">⚡ Quick Match</button><button id="practice">Practice arena</button></div><div class="mode"><select id="lobbyVisibility" aria-label="Lobby visibility"><option value="public">Public</option><option value="friends">Friends</option><option value="private">Private invite</option></select><button id="createLobby">Create lobby</button></div><p id="lobbyInfo" class="fine"><a href="/lobbies/">Browse All Open Lobbies</a> · Quick Match pairs Phone with Desktop players.</p></section><section id="game" hidden><div class="hud"><span id="role"></span><strong id="timer">01:30</strong><span>PHONE <b id="phoneScore">0</b> · <b id="desktopScore">0</b> DESKTOP</span><button id="leave">Leave</button></div><div id="cheatWatermark" hidden>CHEAT MODE</div><canvas id="arena" width="960" height="540" aria-label="Platform Wars arena"></canvas><div id="banner"></div><div class="touch" aria-label="Touch controls"><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="jump">▲</button><button data-key="dash">⚡</button></div></section></main><script>
/* Single-deploy auth transport (same-origin /api/*, session cookies).
 * Replaces the legacy /auth/config.js + /auth/auth-server.js pair: on one
 * Vercel deploy the game is same-origin with the API, so no cross-site
 * base URL or CORS allowlist is needed. Paths outside /api/* are refused. */
window.FourWeirdServer = { request: async function (path, options) {
  path = String(path || '');
  if (path.charAt(0) !== '/' || path.indexOf('/api/') !== 0) return { success: false, error: 'Refused.' };
  var init = { method: (options && options.method) || 'GET', credentials: 'include', headers: { 'Content-Type': 'application/json' } };
  if (options && options.body !== undefined) init.body = typeof options.body === 'string' ? options.body : JSON.stringify(options.body);
  try {
    var res = await fetch(path, init);
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) return { success: false, error: String(data.error || ('HTTP ' + res.status)).slice(0, 200) };
    return data || { success: true };
  } catch (e) { return { success: false, error: 'Service unreachable.' }; }
} };
</script><script src="game.js"></script></body></html>
