[package]
name = "fourweird-api-key-manager"
version = "1.0.0"
description = "4weird API Key Manager — OS-credential-store vault for agent + service API keys"
authors = ["4WEIRD Team"]
edition = "2021"

[lib]
name = "fourweird_api_key_manager"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
# Pinned to the exact Tauri release already vendored in this environment
# (same version the vibecodeworker desktop ships), so release builds reuse
# the warm cargo cache instead of downloading a fresh framework.
tauri = { version = "=2.11.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS credential store: Windows Credential Manager (DPAPI) / macOS Keychain /
# Linux Secret Service. Secrets never touch our own files.
keyring = "3"
# Best-effort in-memory wiping of secret buffers on drop.
zeroize = "1"
