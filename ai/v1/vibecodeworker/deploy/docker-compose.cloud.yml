# Production cloud compose — cheap single-box deploy (droplet, Hetzner, Lightsail).
# Copy this file + .env to /opt/vibecodeworker on the box, then:
#   VIBE_API_TOKEN=$(openssl rand -hex 24) docker compose -f docker-compose.cloud.yml up -d --build
#
# VIBE_API_TOKEN is REQUIRED here (refused to start without it — see command below).
services:
  vibecodeworker:
    build:
      context: /opt/vibecodeworker/repo
      dockerfile: ai/v1/vibecodeworker/Dockerfile
      args:
        INSTALL_OPENCODE: "${INSTALL_OPENCODE:-true}"
    image: vibecodeworker:cloud
    ports:
      - "${PORT:-42069}:42069"
    environment:
      PORT: 42069
      HOST: 0.0.0.0
      STATIC_PORT: 8888
      VIBE_API_TOKEN: "${VIBE_API_TOKEN:?Set VIBE_API_TOKEN in .env before starting}"
      OPENCODE_ENABLED: "${OPENCODE_ENABLED:-true}"
      OPENCODE_MODE: "${OPENCODE_MODE:-cli}"
      OPENCODE_MODEL: "${OPENCODE_MODEL:-}"
      OPENCODE_SERVER_URL: "http://opencode-server:4096"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:-}"
    volumes:
      - vibe-data:/app/ai/v1/vibecodeworker/data
      - /opt/vibecodeworker/repo:/app:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:42069/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: persistent OpenCode server for server-mode fixes (no CLI cold boot).
  opencode-server:
    image: vibecodeworker:cloud
    profiles: ["opencode"]
    command: ["opencode", "serve", "--port", "4096", "--hostname", "0.0.0.0"]
    working_dir: /app
    environment:
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:-}"
    expose:
      - "4096"
    volumes:
      - /opt/vibecodeworker/repo:/app:rw
    restart: unless-stopped

volumes:
  vibe-data:
