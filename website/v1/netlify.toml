[build]
  publish = "."
  command = "echo 'No build step required for static site'"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/vcw"
  to = "/vibecodeworker"
  status = 301

[[redirects]]
  from = "/vibecodeworker/preview"
  to = "/vibecodeworker/preview/"
  status = 301

[[redirects]]
  from = "/pricing"
  to = "/pricing/"
  status = 301

[[redirects]]
  from = "/vibecodeworker/run"
  to = "/vibecodeworker/run.html"
  status = 200

[[redirects]]
  from = "/vibecodeworker/run/"
  to = "/vibecodeworker/run.html"
  status = 200

[[redirects]]
  from = "/vibecodeworker"
  to = "/vibecodeworker/overview.html"
  status = 200

[[redirects]]
  from = "/vibecodeworker/"
  to = "/vibecodeworker/overview.html"
  status = 200

[[redirects]]
  from = "/html/*"
  to = "/games/html/:splat"
  status = 301

[[redirects]]
  from = "/games/*"
  to = "/games/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
