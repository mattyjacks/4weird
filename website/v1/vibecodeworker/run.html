<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cloud Run - VibeCodeWorker | 4weird</title>
  <meta name="description" content="Rent a Runpod cloud box with your own API key. Game plus local multimodal model on one GPU, 55 minute cap, per second billing.">
  <link rel="canonical" href="https://4weird.com/vcw/web/run">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vcw-nav.css">
  <style>
    .run-wrap { max-width: 900px; margin: 24px auto; padding: 20px; }
    .run-card { border: 1px solid var(--border-color, #222); border-radius: 12px; padding: 18px; margin-bottom: 16px; background: rgba(255,255,255,.02); }
    .run-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
    .run-row label { font-size: 12px; opacity: .8; display: block; margin-bottom: 4px; }
    .run-row input, .run-row select { padding: 8px; border-radius: 8px; border: 1px solid #333; background: #0a0d14; color: #fff; min-width: 220px; }
    .run-btn { padding: 10px 16px; border-radius: 10px; border: 1px solid #00f2fe; background: rgba(0,242,254,.1); color: #fff; cursor: pointer; }
    .run-btn.danger { border-color: #ff5470; background: rgba(255,84,112,.1); }
    .run-mono { font-family: monospace; font-size: 13px; }
    #run-log { white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
    #run-view { width: 100%; height: 420px; border: 1px solid #333; border-radius: 10px; background: #000; }
  </style>
</head>
<body data-vcw="run">
  <div class="run-wrap">
    <h1>Cloud Run</h1>
    <p>Low spec device? Rent a cloud GPU with your own Runpod key. Game and model share one box for low latency. Hard cap 55 minutes. Billed per second. Key stays in this tab only.</p>
    <div class="run-card">
      <div class="run-row">
        <div><label>Runpod API key (BYOK, session only)</label><input id="run-key" type="password" autocomplete="off" placeholder="rpa_..."></div>
        <div><label>Game</label><select id="run-game"><option value="gravegain3d">GraveGain 3D</option><option value="gravegain2d">GraveGain 2D</option></select></div>
        <div><label>GPU (cheapest available default)</label><select id="run-gpu"></select></div>
      </div>
      <div class="run-row">
        <button class="run-btn" id="run-refresh">Refresh cheapest available</button>
        <button class="run-btn" id="run-launch">Launch cloud run</button>
        <button class="run-btn danger" id="run-stop">Stop (ends billing)</button>
        <button class="run-btn" id="run-forget">Forget key</button>
      </div>
      <div class="run-mono" id="run-status">Idle. Max 55:00. Per second billing.</div>
      <div class="run-mono" id="run-cost">Cost: $0.0000</div>
    </div>
    <div class="run-card"><h3>Live viewport</h3><iframe id="run-view" title="Cloud game viewport" sandbox="allow-scripts allow-same-origin"></iframe></div>
    <div class="run-card"><h3>Log (key never appears here)</h3><div class="run-mono" id="run-log"></div></div>
  </div>
  <script src="vcw-nav.js"></script>
  <script src="run.js"></script>
</body>
</html>
