<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile — 4weird</title><link rel="stylesheet" href="../my/portal.css"></head><body><main><a href="/my/">← My 4weird</a><h1>My public profile</h1><div class="card"><h2 id="name">Player</h2><p id="copy">Share your profile to find friends and compare your games.</p><button id="share">Share profile</button></div><script src="/auth/config.js"></script><script src="/auth/auth-server.js"></script><script>(window.FourWeirdServer?.request('/api/me/profile')||Promise.resolve({})).then(x=>document.querySelector('#name').textContent=x.profile?.display_name||'Player');document.querySelector('#share').onclick=async()=>{try{await navigator.share({title:'My 4weird profile',url:location.href})}catch{navigator.clipboard?.writeText(location.href);document.querySelector('#copy').textContent='Profile link copied.'}}</script></main></body></html>
